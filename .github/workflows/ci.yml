name: CI

on:
  pull_request:
    branches:
      - dev

jobs:
  lint_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install ruff pytest
          # si tu as d'autres dépendances, ajoute-les ici

      - name: Run Ruff
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Run Tests
        run: |
          source .venv/bin/activate
          pytest
